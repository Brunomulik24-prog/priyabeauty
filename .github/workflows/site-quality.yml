# Runs Google Lighthouse (SEO, accessibility, best practices, speed) on the main pages
# after every change, and on demand. Scores are warnings only; reports are kept as a download.
name: Site quality check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @lhci/cli@0.15.1 autorun --config=.github/lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
